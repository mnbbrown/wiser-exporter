version: 2

project_name: wiser-exporter

builds:
  - main: .
    binary: wiser-exporter
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.date={{ .Date }}
    goos:
      - linux
    goarch:
      - amd64
      - arm
      - arm64
    goarm:
      - "6"
      - "7"

archives:
  - name_template: "wiser-exporter-{{ .Version }}.{{ .Os }}-{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    wrap_in_directory: true

checksum:
  name_template: checksums.txt

nfpms:
  - homepage: https://github.com/mnbbrown/wiser-exporter
    maintainer: me@matthewbrown.io
    description: Prometheus exporter for Drayton Wiser heating systems, including OpenTherm boiler data
    license: MIT
    formats:
      - deb
    bindir: /usr/bin
    contents:
      - src: packaging/wiser-exporter.service
        dst: /lib/systemd/system/wiser-exporter.service
      - src: packaging/default/wiser-exporter
        dst: /etc/default/wiser-exporter
        type: config|noreplace
    scripts:
      postinstall: packaging/scripts/postinstall.sh
      postremove: packaging/scripts/postremove.sh
      preremove: packaging/scripts/preremove.sh

release:
  github:
    owner: mnbbrown
    name: wiser-exporter
  draft: false
  prerelease: auto
